<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101215"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Track Day Log"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>Track Day Log</title><style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15181d;--card2:#1c2026;--line:#2b3038;--text:#f4f6f8;--muted:#9aa3ad;--accent:#f0b429;--good:#48c78e;--bad:#ff6b6b;--r:18px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding-bottom:96px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 12px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.brand img{width:34px;height:34px}.sub,.small{font-size:12px;color:var(--muted)}main{max-width:760px;margin:auto;padding:16px}.view{display:none}.view.active{display:block}.hero,.card{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px}.hero{padding:20px;background:linear-gradient(145deg,#1d2229,#12151a);border-radius:22px}.hero h1{font-size:27px;margin:4px 0}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.stat{font-size:26px;font-weight:800}.muted{color:var(--muted)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.sectiontitle h2,.card h3{margin:0}.btn{border:0;border-radius:13px;padding:12px 14px;background:var(--accent);color:#111;font-weight:800}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3b1d20;color:#ffb9bd;border:1px solid #5f2b31}.btn.smallbtn{padding:8px 10px;font-size:13px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:84px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}.check.done .ctxt{text-decoration:line-through;color:var(--muted)}.progress{height:8px;background:#292e35;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.pill{display:inline-block;border:1px solid var(--line);background:var(--card2);color:var(--muted);padding:5px 8px;border-radius:999px;font-size:12px}.pill.good{color:#baf3d9;border-color:#285d46}.session{border-left:3px solid var(--accent)}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.metric div{background:#0f1216;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.metric b{display:block}.empty{text-align:center;color:var(--muted);padding:30px 14px}.code{font:700 18px ui-monospace,SFMono-Regular,monospace;letter-spacing:1px;background:#0f1216;border:1px dashed #4a515b;border-radius:12px;padding:12px;text-align:center;margin:10px 0}nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(15,17,21,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line)}nav button{background:none;border:0;color:var(--muted);padding:6px 3px;font-size:11px}nav button span{display:block;font-size:21px}nav button.active{color:var(--accent)}dialog{width:min(94vw,680px);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:#15181d;color:var(--text);padding:18px}dialog::backdrop{background:#0009}.dialogtop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;color:var(--muted);font-size:28px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;display:none;white-space:nowrap}@media(max-width:520px){.grid,.formgrid{grid-template-columns:1fr}.metric{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}}
</style></head><body><header><div class="brand"><img src="icon.svg" alt=""><div>Track Day Log<div class="sub">Prepare · Drive · Learn</div></div></div></header><main><section id="home" class="view active"></section><section id="garage" class="view"></section><section id="days" class="view"></section><section id="settings" class="view"></section></main><nav><button data-view="home" class="active"><span>🏁</span>Today</button><button data-view="garage"><span>🚗</span>Garage</button><button data-view="days"><span>🗓️</span>Track Days</button><button data-view="settings"><span>⚙️</span>Settings</button></nav><div id="toast" class="toast"></div><dialog id="modal"><div class="dialogtop"><h2 id="modalTitle"></h2><button class="close" onclick="modal.close()">×</button></div><div id="modalBody"></div></dialog><script>
const KEY='trackDayLogV1',SYNC_KEY_NAME='trackDayLogSyncKeyV1';
const SUPABASE_URL='https://uehmbzwnbariqebbxcst.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXB hYmFzZSIsInJlZiI6InVlaG1ienduYmFyaXFlYmJ4Y3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjcyODIsImV4cCI6MjEwNDY0MzI4Mn0.zA_oLHdFNGi9nu5Z4zRT9dAMGGRjkXg5jyNwgf_n1Ok'.replace(' ','');
const defaults={version:2,cars:[],days:[],customPrep:[],customPack:[],updatedAt:null};
const prepDefault=['Engine oil level','Coolant level','Brake fluid level','Steering / power steering check','Check for fluid leaks','Brake pad material','Brake discs visual check','Wheel nuts / bolts torqued','Tyre condition and damage','Cold tyre pressures set','Wheel bearings / play','Suspension and steering visual check','Battery secure','Seats and mounts secure','Harnesses / seat belts secure','Fire extinguisher secure (if fitted)','Cabin and boot clear of loose items','Fuel level'];
const packDefault=['Helmet','Driving licence / ID','Booking confirmation','Tyre pressure gauge','Torque wrench','Air compressor / pump','Basic tools','Spare fluids','Towing eye','Phone charger / power bank','Water / food'];
let db=load(),syncCode=localStorage.getItem(SYNC_KEY_NAME)||makeSyncCode(),syncTimer;
localStorage.setItem(SYNC_KEY_NAME,syncCode);
function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(defaults)}}
function makeSyncCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return'TDL-'+[...a].slice(0,4).map(x=>chars[x%chars.length]).join('')+'-'+[...a].slice(4).map(x=>chars[x%chars.length]).join('')}
function headers(){return{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'}}
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function cloudPush(){try{await rpc('track_day_log_push',{p_sync_key:syncCode,p_data:db});setCloud('Synced')}catch(e){console.warn(e);setCloud('Offline — saved on device')}}
async function cloudPull(code=syncCode){const rows=await rpc('track_day_log_pull',{p_sync_key:code});return rows&&rows.length?rows[0]:null}
function save(skipCloud=false){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));render();if(!skipCloud){clearTimeout(syncTimer);syncTimer=setTimeout(cloudPush,500)}}
async function bootSync(){try{const remote=await cloudPull();if(remote&&remote.data){const localEmpty=!db.cars.length&&!db.days.length;const remoteNewer=(remote.data.updatedAt||'')>(db.updatedAt||'');if(localEmpty||remoteNewer){db=Object.assign({},defaults,remote.data);localStorage.setItem(KEY,JSON.stringify(db));render()}}else await cloudPush();setCloud('Synced')}catch(e){console.warn(e);setCloud('Offline — saved on device')}}
function setCloud(t){const e=document.getElementById('cloudState');if(e)e.textContent=t}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){if(!v)return'';return new Date(v+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function carName(cid){const c=db.cars.find(x=>x.id===cid);return c?c.name:'No car'}
function currentDay(){return db.days.filter(d=>!d.finished).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function render(){renderHome();renderGarage();renderDays();renderSettings()}
function renderHome(){const el=home,d=currentDay();if(!db.cars.length){el.innerHTML=`<div class="hero"><span class="pill">WELCOME</span><h1>Ready for your first track day?</h1><p>Add your car once. Then prepare, log sessions and build a useful history every time you go out.</p></div><button class="btn" onclick="openCar()">Add your first car</button>`;return}if(!d){el.innerHTML=`<div class="hero"><h1>Your next track day starts here.</h1><p>Create an event and the app will build your preparation checklist automatically.</p></div><div class="grid"><div class="card"><div class="stat">${db.cars.length}</div><div class="muted">car${db.cars.length===1?'':'s'} in garage</div></div><div class="card"><div class="stat">${db.days.filter(x=>x.finished).length}</div><div class="muted">completed days</div></div></div><button class="btn" onclick="openDay()">Create track day</button>`;return}const checks=[...(d.prep||[]),...(d.pack||[])],done=checks.filter(x=>x.done).length,pct=checks.length?Math.round(done/checks.length*100):0;el.innerHTML=`<div class="hero"><span class="pill">NEXT TRACK DAY</span><h1>${esc(d.track)}</h1><p>${fmtDate(d.date)} · ${esc(carName(d.carId))}</p></div><div class="card"><div class="row"><b>Preparation</b><span>${done}/${checks.length}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="small muted" style="margin-top:7px">${pct}% complete</div></div><div class="grid"><button class="btn secondary" onclick="openChecklist('${d.id}')">Preparation</button><button class="btn secondary" onclick="openSession('${d.id}')">+ Log session</button></div><div class="sectiontitle"><h2>Sessions</h2><span class="pill">${(d.sessions||[]).length}</span></div>${sessionCards(d)}<button class="btn" style="width:100%;margin-top:8px" onclick="finishDay('${d.id}')">Finish track day</button>`}
function renderGarage(){garage.innerHTML=`<div class="sectiontitle"><h2>Garage</h2><button class="btn smallbtn" onclick="openCar()">+ Add car</button></div>${db.cars.length?db.cars.map(c=>`<div class="card"><div class="row"><div><h3>${esc(c.name)}</h3><div class="muted small">${esc([c.year,c.make,c.model].filter(Boolean).join(' · '))}</div></div><button class="btn secondary smallbtn" onclick="openCar('${c.id}')">Edit</button></div>${c.tyres?`<div class="small muted" style="margin-top:10px">Tyres: ${esc(c.tyres)}</div>`:''}${(c.coldF||c.coldR)?`<div class="small" style="margin-top:5px">Baseline cold: ${esc(c.coldF||'—')}F / ${esc(c.coldR||'—')}R psi</div>`:''}${c.notes?`<p class="small">${esc(c.notes)}</p>`:''}</div>`).join(''):`<div class="empty">No cars added yet.</div>`}`}
function renderDays(){const xs=[...db.days].sort((a,b)=>b.date.localeCompare(a.date));days.innerHTML=`<div class="sectiontitle"><h2>Track Days</h2><button class="btn smallbtn" onclick="openDay()">+ New</button></div>${xs.length?xs.map(d=>`<div class="card"><div class="row"><div><h3>${esc(d.track)}</h3><div class="muted small">${fmtDate(d.date)} · ${esc(carName(d.carId))}</div></div><span class="pill ${d.finished?'good':''}">${d.finished?'Finished':'Active'}</span></div><div class="row wrap" style="margin-top:12px"><span class="small muted">${(d.sessions||[]).length} sessions${bestLap(d)?` · PB ${esc(bestLap(d))}`:''}</span><div><button class="btn secondary smallbtn" onclick="openDayDetail('${d.id}')">Open</button> <button class="btn danger smallbtn" onclick="deleteDay('${d.id}')">Delete</button></div></div></div>`).join(''):`<div class="empty">Your track-day history will appear here.</div>`}`}
function renderSettings(){settings.innerHTML=`<div class="sectiontitle"><h2>Settings & backup</h2></div><div class="card"><div class="row"><h3>Cloud recovery</h3><span id="cloudState" class="pill">Syncing…</span></div><p class="small muted">Each installation gets a private recovery code. Keep it somewhere safe. You can use it after reinstalling the app or on another device to restore your garage and track-day history.</p><div class="code">${esc(syncCode)}</div><div class="grid"><button class="btn secondary" onclick="copyCode()">Copy code</button><button class="btn secondary" onclick="useExistingCode()">Use existing code</button></div><p class="small muted">Anyone with this code can access this app data, so treat it like a password.</p></div><div class="card"><h3>Manual backup</h3><div class="grid" style="margin-top:10px"><button class="btn secondary" onclick="exportData()">Export backup</button><button class="btn secondary" onclick="importFile.click()">Restore backup</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></div><div class="card"><h3>Custom checklist items</h3><p class="small muted">These appear on every new track day you create.</p><button class="btn secondary smallbtn" onclick="addCustom('prep')">+ Preparation</button> <button class="btn secondary smallbtn" onclick="addCustom('pack')">+ Packing</button>${[...db.customPrep.map(x=>'Prep: '+x),...db.customPack.map(x=>'Pack: '+x)].map(x=>`<div class="small" style="margin-top:8px">• ${esc(x)}</div>`).join('')}</div><div class="card"><h3>About</h3><div class="small muted">Track Day Log V1 · Generic track-day preparation, session logging and development history.</div></div>`}
function openCar(cid){const c=db.cars.find(x=>x.id===cid)||{};modalTitle.textContent=cid?'Edit car':'Add car';modalBody.innerHTML=`<label>Car name</label><input id="cname" value="${esc(c.name||'')}" placeholder="e.g. Civic Type R"><div class="formgrid"><div><label>Year</label><input id="cyear" value="${esc(c.year||'')}"></div><div><label>Make</label><input id="cmake" value="${esc(c.make||'')}"></div></div><label>Model</label><input id="cmodel" value="${esc(c.model||'')}"><label>Tyre size</label><input id="ctyres" value="${esc(c.tyres||'')}" placeholder="e.g. 205/45 R16"><div class="formgrid"><div><label>Baseline cold front psi</label><input id="ccf" type="number" step="0.5" value="${esc(c.coldF||'')}"></div><div><label>Baseline cold rear psi</label><input id="ccr" type="number" step="0.5" value="${esc(c.coldR||'')}"></div></div><label>Notes</label><textarea id="cnotes">${esc(c.notes||'')}</textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveCar('${cid||''}')">Save car</button>`;modal.showModal()}
function saveCar(cid){if(!cname.value.trim())return toast('Give the car a name');const item={id:cid||id(),name:cname.value.trim(),year:cyear.value.trim(),make:cmake.value.trim(),model:cmodel.value.trim(),tyres:ctyres.value.trim(),coldF:ccf.value,coldR:ccr.value,notes:cnotes.value.trim()};const i=db.cars.findIndex(x=>x.id===cid);if(i>=0)db.cars[i]=item;else db.cars.push(item);modal.close();save();toast('Car saved')}
function openDay(){if(!db.cars.length)return openCar();modalTitle.textContent='New track day';modalBody.innerHTML=`<label>Circuit</label><input id="dtrack" placeholder="e.g. Donington Park"><label>Date</label><input id="ddate" type="date"><label>Car</label><select id="dcar">${db.cars.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Organiser (optional)</label><input id="dorg" placeholder="e.g. Javelin"><button class="btn" style="width:100%;margin-top:14px" onclick="saveDay()">Create track day</button>`;modal.showModal()}
function saveDay(){if(!dtrack.value.trim()||!ddate.value)return toast('Add circuit and date');const prep=[...prepDefault,...db.customPrep].map(t=>({id:id(),text:t,done:false})),pack=[...packDefault,...db.customPack].map(t=>({id:id(),text:t,done:false}));db.days.push({id:id(),track:dtrack.value.trim(),date:ddate.value,carId:dcar.value,organiser:dorg.value.trim(),prep,pack,sessions:[],jobs:[],finished:false});modal.close();save();nav('home');toast('Track day created')}
function openChecklist(did){const d=db.days.find(x=>x.id===did);modalTitle.textContent='Preparation';modalBody.innerHTML=`<h3>Car checks</h3>${checkHtml(d,'prep')}<h3 style="margin-top:18px">Packing</h3>${checkHtml(d,'pack')}<button class="btn secondary" style="width:100%;margin-top:14px" onclick="addDayCheck('${did}')">+ Add item for this day</button>`;modal.showModal()}
function checkHtml(d,type){return(d[type]||[]).map(x=>`<label class="check ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleCheck('${d.id}','${type}','${x.id}',this.checked)"><span class="ctxt">${esc(x.text)}${x.checkedAt?`<div class="small">${new Date(x.checkedAt).toLocaleString()}</div>`:''}</span></label>`).join('')}
function toggleCheck(did,type,cid,val){const d=db.days.find(x=>x.id===did),c=d[type].find(x=>x.id===cid);c.done=val;c.checkedAt=val?new Date().toISOString():null;save();openChecklist(did)}
function addDayCheck(did){const t=prompt('Checklist item');if(!t)return;db.days.find(x=>x.id===did).prep.push({id:id(),text:t.trim(),done:false});save();openChecklist(did)}
function openSession(did){const d=db.days.find(x=>x.id===did);modalTitle.textContent=`Session ${(d.sessions||[]).length+1}`;modalBody.innerHTML=`<div class="formgrid"><div><label>Best lap</label><input id="slap" placeholder="e.g. 1:22.4"></div><div><label>Fuel</label><input id="sfuel" placeholder="e.g. 1/2 tank"></div></div><h3>Hot tyre pressures</h3><div class="formgrid"><div><label>Front left psi</label><input id="sfl" type="number" step="0.5"></div><div><label>Front right psi</label><input id="sfr" type="number" step="0.5"></div><div><label>Rear left psi</label><input id="srl" type="number" step="0.5"></div><div><label>Rear right psi</label><input id="srr" type="number" step="0.5"></div></div><div class="formgrid"><div><label>Brakes</label><select id="sbr"><option>Good</option><option>Monitor</option><option>Problem</option></select></div><div><label>Temperatures</label><select id="stemp"><option>Good</option><option>Warm</option><option>High</option><option>Unknown</option></select></div></div><label>Car / driver notes</label><textarea id="snotes" placeholder="Balance, braking, traffic, confidence, corners..."></textarea><label>Adjustment before next session</label><textarea id="sadj" placeholder="Pressure change, damping, driving focus..."></textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveSession('${did}')">Save session</button>`;modal.showModal()}
function saveSession(did){const d=db.days.find(x=>x.id===did);d.sessions.push({id:id(),number:d.sessions.length+1,time:new Date().toISOString(),lap:slap.value.trim(),fuel:sfuel.value.trim(),fl:sfl.value,fr:sfr.value,rl:srl.value,rr:srr.value,brakes:sbr.value,temp:stemp.value,notes:snotes.value.trim(),adjustment:sadj.value.trim()});modal.close();save();toast('Session logged')}
function sessionCards(d){if(!(d.sessions||[]).length)return`<div class="empty card">No sessions logged yet.</div>`;return d.sessions.map(s=>`<div class="card session"><div class="row"><h3>Session ${s.number}</h3>${s.lap?`<b>${esc(s.lap)}</b>`:''}</div>${(s.fl||s.fr||s.rl||s.rr)?`<div class="metric"><div><span class="small muted">FL</span><b>${esc(s.fl||'—')}</b></div><div><span class="small muted">FR</span><b>${esc(s.fr||'—')}</b></div><div><span class="small muted">RL</span><b>${esc(s.rl||'—')}</b></div><div><span class="small muted">RR</span><b>${esc(s.rr||'—')}</b></div></div>`:''}<div class="small muted">Brakes: ${esc(s.brakes)} · Temps: ${esc(s.temp)}${s.fuel?` · Fuel: ${esc(s.fuel)}`:''}</div>${s.notes?`<p>${esc(s.notes)}</p>`:''}${s.adjustment?`<div class="small"><b>Next:</b> ${esc(s.adjustment)}</div>`:''}</div>`).join('')}
function lapSecs(v){if(!v)return 1e9;const p=v.replace(/[^0-9:.]/g,'').split(':');if(p.length===2)return(+p[0]*60)+parseFloat(p[1]);return parseFloat(p[0])||1e9}
function bestLap(d){const laps=(d.sessions||[]).map(s=>s.lap).filter(Boolean).sort((a,b)=>lapSecs(a)-lapSecs(b));return laps[0]||''}
function finishDay(did){modalTitle.textContent='Finish track day';modalBody.innerHTML=`<p class="muted">Capture the useful jobs and lessons while they are fresh.</p><label>Jobs / faults found</label><textarea id="fjobs" placeholder="One per line"></textarea><label>End-of-day notes</label><textarea id="fnotes" placeholder="What worked? What would you change next time?"></textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveFinish('${did}')">Finish & save history</button>`;modal.showModal()}
function saveFinish(did){const d=db.days.find(x=>x.id===did);d.jobs=fjobs.value.split('\n').map(x=>x.trim()).filter(Boolean);d.endNotes=fnotes.value.trim();d.finished=true;d.finishedAt=new Date().toISOString();modal.close();save();nav('days');toast('Track day saved')}
function openDayDetail(did){const d=db.days.find(x=>x.id===did),all=[...(d.prep||[]),...(d.pack||[])];modalTitle.textContent=d.track;modalBody.innerHTML=`<div class="muted">${fmtDate(d.date)} · ${esc(carName(d.carId))}${d.organiser?` · ${esc(d.organiser)}`:''}</div><div class="grid" style="margin-top:12px"><div class="card"><div class="stat">${d.sessions.length}</div><div class="small muted">sessions</div></div><div class="card"><div class="stat">${esc(bestLap(d)||'—')}</div><div class="small muted">best lap</div></div></div>${sessionCards(d)}${d.jobs?.length?`<h3>Jobs</h3>${d.jobs.map(x=>`<div class="check"><span>🔧</span><span>${esc(x)}</span></div>`).join('')}`:''}${d.endNotes?`<h3>End-of-day notes</h3><p>${esc(d.endNotes)}</p>`:''}<div class="small muted">Preparation: ${all.filter(x=>x.done).length}/${all.length} completed</div>`;modal.showModal()}
function deleteDay(did){if(!confirm('Delete this track day and its sessions?'))return;db.days=db.days.filter(x=>x.id!==did);save()}
function addCustom(type){const t=prompt(type==='prep'?'New preparation item':'New packing item');if(!t)return;(type==='prep'?db.customPrep:db.customPack).push(t.trim());save()}
async function copyCode(){try{await navigator.clipboard.writeText(syncCode);toast('Recovery code copied')}catch{prompt('Copy your recovery code:',syncCode)}}
async function useExistingCode(){const code=(prompt('Enter your Track Day Log recovery code:',syncCode)||'').trim().toUpperCase();if(!code||code===syncCode)return;try{const remote=await cloudPull(code);if(remote&&remote.data){if(!confirm('Restore the cloud data linked to this code and replace the data on this device?'))return;syncCode=code;localStorage.setItem(SYNC_KEY_NAME,syncCode);db=Object.assign({},defaults,remote.data);localStorage.setItem(KEY,JSON.stringify(db));render();toast('Cloud data restored')}else if(confirm('No cloud data exists for that code. Link your current data to it instead?')){syncCode=code;localStorage.setItem(SYNC_KEY_NAME,syncCode);await cloudPush();render();toast('Recovery code linked')}}catch{alert('Could not reach cloud sync. Your device data has not been changed.')}}
function exportData(){const blob=new Blob([JSON.stringify({syncCode,data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`track-day-log-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result),data=x.data||x;if(!data.cars||!data.days)throw 0;if(confirm('Replace current Track Day Log data with this backup?')){db=Object.assign({},defaults,data);if(x.syncCode){syncCode=x.syncCode;localStorage.setItem(SYNC_KEY_NAME,syncCode)}save();toast('Backup restored')}}catch{alert('That does not look like a Track Day Log backup.')}};r.readAsText(file)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();bootSync();
</script></body></html>
