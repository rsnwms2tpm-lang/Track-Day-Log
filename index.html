<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101215" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Track Day Log" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Track Day Log</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--card:#15181d;--card2:#1c2026;--line:#2b3038;--text:#f4f6f8;--muted:#9aa3ad;--accent:#f0b429;--good:#48c78e;--bad:#ff6b6b;--radius:18px}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding-bottom:96px}button,input,select,textarea{font:inherit}button{cursor:pointer}
    header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.brand svg{width:31px;height:31px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
    main{max-width:760px;margin:0 auto;padding:16px}.view{display:none}.view.active{display:block}.hero{padding:20px;background:linear-gradient(145deg,#1d2229,#12151a);border:1px solid var(--line);border-radius:22px;margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:28px}.hero p{margin:0;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:10px}.card h3{margin:0 0 7px}.stat{font-size:26px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}
    .btn{border:0;border-radius:13px;padding:12px 14px;background:var(--accent);color:#111;font-weight:800}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3b1d20;color:#ffb9bd;border:1px solid #5f2b31}.btn.smallbtn{padding:8px 10px;font-size:13px}.fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;font-size:29px;padding:0;box-shadow:0 8px 24px #0008}
    nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(15,17,21,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line)}nav button{background:none;border:0;color:var(--muted);padding:6px 3px;font-size:11px}nav button span{display:block;font-size:21px;margin-bottom:2px}nav button.active{color:var(--accent)}
    label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:88px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.sectiontitle h2{font-size:18px;margin:0}
    .check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}.check input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto;margin:0}.check.done .ctxt{text-decoration:line-through;color:var(--muted)}.progress{height:8px;background:#292e35;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:var(--accent)}
    .pill{display:inline-block;border:1px solid var(--line);background:var(--card2);color:var(--muted);padding:5px 8px;border-radius:999px;font-size:12px}.pill.good{color:#baf3d9;border-color:#285d46}.session{border-left:3px solid var(--accent)}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.metric div{background:#0f1216;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.metric b{display:block;font-size:16px}.empty{text-align:center;color:var(--muted);padding:30px 14px}.divider{height:1px;background:var(--line);margin:14px 0}
    dialog{width:min(94vw,680px);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:#15181d;color:var(--text);padding:18px}dialog::backdrop{background:#0009}.dialogtop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;color:var(--muted);font-size:28px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;display:none}
    @media(max-width:520px){.grid,.formgrid{grid-template-columns:1fr}.metric{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}
  </style>
</head>
<body>
<header><div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#f0b429" d="M6 41h52v7H6zM12 34h40l-5-11H22z"/><circle cx="19" cy="49" r="6" fill="#e8edf2"/><circle cx="45" cy="49" r="6" fill="#e8edf2"/><path fill="#fff" d="M39 9l5 6-5 6h7l5-6-5-6z"/></svg><div>Track Day Log<div class="sub">Prepare · Drive · Learn</div></div></div></header>
<main>
<section id="home" class="view active"></section>
<section id="garage" class="view"></section>
<section id="days" class="view"></section>
<section id="settings" class="view"></section>
</main>
<nav>
<button data-view="home" class="active"><span>🏁</span>Today</button>
<button data-view="garage"><span>🚗</span>Garage</button>
<button data-view="days"><span>🗓️</span>Track Days</button>
<button data-view="settings"><span>⚙️</span>Settings</button>
</nav>
<div id="toast" class="toast"></div>
<dialog id="modal"><div class="dialogtop"><h2 id="modalTitle"></h2><button class="close" onclick="modal.close()">×</button></div><div id="modalBody"></div></dialog>
<script>
const KEY='trackDayLogV1';
const defaults={version:1,cars:[],days:[],customPrep:[],customPack:[]};
let db=load();
const prepDefault=['Engine oil level','Coolant level','Brake fluid level','Power steering fluid / steering system','Check for fluid leaks','Brake pad material','Brake discs visual check','Wheel nuts / bolts torqued','Tyre condition and damage','Cold tyre pressures set','Wheel bearings / play','Suspension and steering visual check','Battery secure','Seats and mounts secure','Harnesses / seat belts secure','Fire extinguisher secure (if fitted)','Cabin and boot clear of loose items','Fuel level'];
const packDefault=['Helmet','Driving licence / ID','Booking confirmation','Tyre pressure gauge','Torque wrench','Air compressor / pump','Basic tools','Spare fluids','Towing eye','Phone charger / power bank','Water / food'];
function load(){try{return Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){if(!v)return'';return new Date(v+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function carName(cid){const c=db.cars.find(x=>x.id===cid);return c?c.name:'No car'}
function currentDay(){const open=db.days.filter(d=>!d.finished).sort((a,b)=>a.date.localeCompare(b.date));if(open.length)return open[0];return null}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function render(){renderHome();renderGarage();renderDays();renderSettings()}
function renderHome(){const el=document.getElementById('home'),d=currentDay();if(!db.cars.length){el.innerHTML=`<div class="hero"><h1>Ready for your first track day?</h1><p>Add your car once, then build track-day history from preparation to final debrief.</p></div><button class="btn" onclick="openCar()">Add your first car</button>`;return}if(!d){el.innerHTML=`<div class="hero"><h1>Your next track day starts here.</h1><p>Create an event, work through preparation, then log each session while it is fresh.</p></div><div class="grid"><div class="card"><div class="stat">${db.cars.length}</div><div class="muted">car${db.cars.length===1?'':'s'} in garage</div></div><div class="card"><div class="stat">${db.days.filter(x=>x.finished).length}</div><div class="muted">completed track days</div></div></div><button class="btn" onclick="openDay()">Create track day</button>`;return}const checks=[...(d.prep||[]),...(d.pack||[])],done=checks.filter(x=>x.done).length,pct=checks.length?Math.round(done/checks.length*100):0;el.innerHTML=`<div class="hero"><span class="pill">NEXT TRACK DAY</span><h1>${esc(d.track)}</h1><p>${fmtDate(d.date)} · ${esc(carName(d.carId))}</p></div><div class="card"><div class="row"><b>Preparation</b><span>${done}/${checks.length}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="small muted" style="margin-top:7px">${pct}% complete</div></div><div class="grid"><button class="btn secondary" onclick="openChecklist('${d.id}')">Preparation</button><button class="btn secondary" onclick="openSession('${d.id}')">+ Log session</button></div><div class="sectiontitle"><h2>Sessions</h2><span class="pill">${(d.sessions||[]).length}</span></div>${sessionCards(d)}<button class="btn" style="width:100%;margin-top:8px" onclick="finishDay('${d.id}')">Finish track day</button>`}
function renderGarage(){const el=document.getElementById('garage');el.innerHTML=`<div class="sectiontitle"><h2>Garage</h2><button class="btn smallbtn" onclick="openCar()">+ Add car</button></div>${db.cars.length?db.cars.map(c=>`<div class="card"><div class="row"><div><h3>${esc(c.name)}</h3><div class="muted">${esc([c.year,c.make,c.model].filter(Boolean).join(' · '))}</div></div><button class="btn secondary smallbtn" onclick="openCar('${c.id}')">Edit</button></div>${c.tyres?`<div class="small muted" style="margin-top:10px">Tyres: ${esc(c.tyres)}</div>`:''}${c.notes?`<div class="small" style="margin-top:7px">${esc(c.notes)}</div>`:''}</div>`).join(''):`<div class="empty">No cars added yet.</div>`}`}
function renderDays(){const el=document.getElementById('days');const days=[...db.days].sort((a,b)=>b.date.localeCompare(a.date));el.innerHTML=`<div class="sectiontitle"><h2>Track Days</h2><button class="btn smallbtn" onclick="openDay()">+ New</button></div>${days.length?days.map(d=>`<div class="card"><div class="row"><div><h3>${esc(d.track)}</h3><div class="muted">${fmtDate(d.date)} · ${esc(carName(d.carId))}</div></div><span class="pill ${d.finished?'good':''}">${d.finished?'Finished':'Active'}</span></div><div class="row wrap" style="margin-top:12px"><span class="small muted">${(d.sessions||[]).length} sessions${bestLap(d)?` · PB ${esc(bestLap(d))}`:''}</span><div><button class="btn secondary smallbtn" onclick="openDayDetail('${d.id}')">Open</button> <button class="btn danger smallbtn" onclick="deleteDay('${d.id}')">Delete</button></div></div></div>`).join(''):`<div class="empty">Your track-day history will appear here.</div>`}`}
function renderSettings(){const el=document.getElementById('settings');el.innerHTML=`<div class="sectiontitle"><h2>Settings & backup</h2></div><div class="card"><h3>Your data</h3><p class="muted small">This version stores data on this device. Export a backup before changing phones, clearing browser data or removing the Home Screen app.</p><div class="grid"><button class="btn secondary" onclick="exportData()">Export backup</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Restore backup</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></div><div class="card"><h3>Custom checklist items</h3><p class="small muted">Add items that should appear on every new track day.</p><button class="btn secondary" onclick="addCustom('prep')">+ Preparation item</button> <button class="btn secondary" onclick="addCustom('pack')">+ Packing item</button>${[...db.customPrep.map(x=>'Prep: '+x),...db.customPack.map(x=>'Pack: '+x)].map(x=>`<div class="small" style="margin-top:8px">• ${esc(x)}</div>`).join('')}</div><div class="card"><h3>About</h3><div class="small muted">Track Day Log V1 · Generic track-day preparation, session logging and development history.</div></div>`}
function openCar(cid){const c=db.cars.find(x=>x.id===cid)||{};modalTitle.textContent=c.id?'Edit car':'Add car';modalBody.innerHTML=`<label>Car name</label><input id="cname" value="${esc(c.name||'')}" placeholder="e.g. Civic Type R"><div class="formgrid"><div><label>Year</label><input id="cyear" value="${esc(c.year||'')}"></div><div><label>Make</label><input id="cmake" value="${esc(c.make||'')}"></div></div><label>Model / variant</label><input id="cmodel" value="${esc(c.model||'')}"><label>Tyre size / tyre</label><input id="ctyres" value="${esc(c.tyres||'')}" placeholder="e.g. 205/45 R16 NS-2R"><div class="formgrid"><div><label>Baseline cold front psi</label><input id="cf" type="number" step="0.5" value="${esc(c.coldFront||'')}"></div><div><label>Baseline cold rear psi</label><input id="cr" type="number" step="0.5" value="${esc(c.coldRear||'')}"></div></div><label>Notes</label><textarea id="cnotes">${esc(c.notes||'')}</textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveCar('${c.id||''}')">Save car</button>`;modal.showModal()}
function saveCar(cid){const name=cname.value.trim();if(!name)return toast('Give the car a name');const obj={id:cid||id(),name,year:cyear.value.trim(),make:cmake.value.trim(),model:cmodel.value.trim(),tyres:ctyres.value.trim(),coldFront:cf.value,coldRear:cr.value,notes:cnotes.value.trim()};const i=db.cars.findIndex(x=>x.id===cid);i>=0?db.cars[i]=obj:db.cars.push(obj);modal.close();save();toast('Car saved')}
function openDay(){if(!db.cars.length)return openCar();modalTitle.textContent='New track day';modalBody.innerHTML=`<label>Circuit</label><input id="dtrack" placeholder="e.g. Castle Combe"><label>Date</label><input id="ddate" type="date"><label>Car</label><select id="dcar">${db.cars.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Organiser / notes (optional)</label><input id="dorg" placeholder="e.g. Javelin"><button class="btn" style="width:100%;margin-top:14px" onclick="saveDay()">Create track day</button>`;modal.showModal()}
function saveDay(){if(!dtrack.value.trim()||!ddate.value)return toast('Add circuit and date');const prep=[...prepDefault,...db.customPrep].map(t=>({id:id(),text:t,done:false})),pack=[...packDefault,...db.customPack].map(t=>({id:id(),text:t,done:false}));db.days.push({id:id(),track:dtrack.value.trim(),date:ddate.value,carId:dcar.value,organiser:dorg.value.trim(),prep,pack,sessions:[],jobs:[],finished:false});modal.close();save();nav('home');toast('Track day created')}
function openChecklist(did){const d=db.days.find(x=>x.id===did);modalTitle.textContent='Preparation';modalBody.innerHTML=`<h3>Car checks</h3>${checkHtml(d,'prep')}<h3 style="margin-top:18px">Packing</h3>${checkHtml(d,'pack')}<button class="btn secondary" style="width:100%;margin-top:14px" onclick="addDayCheck('${did}')">+ Add item for this day</button>`;modal.showModal()}
function checkHtml(d,type){return (d[type]||[]).map(x=>`<label class="check ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleCheck('${d.id}','${type}','${x.id}',this.checked)"><span class="ctxt">${esc(x.text)}</span></label>`).join('')}
function toggleCheck(did,type,cid,val){const d=db.days.find(x=>x.id===did),c=d[type].find(x=>x.id===cid);c.done=val;c.checkedAt=val?new Date().toISOString():null;localStorage.setItem(KEY,JSON.stringify(db));openChecklist(did);render()}
function addDayCheck(did){const t=prompt('Checklist item');if(!t)return;const d=db.days.find(x=>x.id===did);d.prep.push({id:id(),text:t,done:false});save();openChecklist(did)}
function openSession(did){const d=db.days.find(x=>x.id===did),c=db.cars.find(x=>x.id===d.carId)||{};modalTitle.textContent=`Session ${(d.sessions||[]).length+1}`;modalBody.innerHTML=`<div class="formgrid"><div><label>Best lap</label><input id="slap" placeholder="e.g. 1:22.4"></div><div><label>Fuel</label><input id="sfuel" placeholder="e.g. 1/2 tank"></div></div><h3>Tyre pressures after session</h3><div class="formgrid"><div><label>Front left psi</label><input id="sfl" type="number" step="0.5"></div><div><label>Front right psi</label><input id="sfr" type="number" step="0.5"></div><div><label>Rear left psi</label><input id="srl" type="number" step="0.5"></div><div><label>Rear right psi</label><input id="srr" type="number" step="0.5"></div></div><div class="formgrid"><div><label>Brakes</label><select id="sbr"><option>Good</option><option>Monitor</option><option>Problem</option></select></div><div><label>Temperatures</label><select id="stemp"><option>Good</option><option>Warm</option><option>High</option><option>Unknown</option></select></div></div><label>How did the car / driver feel?</label><textarea id="snotes" placeholder="Balance, braking, traffic, confidence, corners..."></textarea><label>Adjustment before next session</label><textarea id="sadj" placeholder="Pressure change, damping, driving focus, etc."></textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveSession('${did}')">Save session</button>`;modal.showModal()}
function saveSession(did){const d=db.days.find(x=>x.id===did);d.sessions.push({id:id(),number:d.sessions.length+1,time:new Date().toISOString(),lap:slap.value.trim(),fuel:sfuel.value.trim(),fl:sfl.value,fr:sfr.value,rl:srl.value,rr:srr.value,brakes:sbr.value,temp:stemp.value,notes:snotes.value.trim(),adjustment:sadj.value.trim()});modal.close();save();toast('Session logged')}
function sessionCards(d){if(!(d.sessions||[]).length)return`<div class="empty card">No sessions logged yet.</div>`;return d.sessions.map(s=>`<div class="card session"><div class="row"><h3>Session ${s.number}</h3>${s.lap?`<b>${esc(s.lap)}</b>`:''}</div>${(s.fl||s.fr||s.rl||s.rr)?`<div class="metric"><div><span class="small muted">FL</span><b>${esc(s.fl||'—')}</b></div><div><span class="small muted">FR</span><b>${esc(s.fr||'—')}</b></div><div><span class="small muted">RL</span><b>${esc(s.rl||'—')}</b></div><div><span class="small muted">RR</span><b>${esc(s.rr||'—')}</b></div></div>`:''}<div class="small muted">Brakes: ${esc(s.brakes)} · Temps: ${esc(s.temp)}${s.fuel?` · Fuel: ${esc(s.fuel)}`:''}</div>${s.notes?`<p>${esc(s.notes)}</p>`:''}${s.adjustment?`<div class="small"><b>Next:</b> ${esc(s.adjustment)}</div>`:''}</div>`).join('')}
function bestLap(d){const laps=(d.sessions||[]).map(s=>s.lap).filter(Boolean);return laps.length?laps[laps.length-1]:''}
function finishDay(did){const d=db.days.find(x=>x.id===did);modalTitle.textContent='Finish track day';modalBody.innerHTML=`<p class="muted">Capture the useful jobs and lessons before they disappear from memory.</p><label>Jobs / faults found</label><textarea id="fjobs" placeholder="One per line"></textarea><label>End-of-day notes</label><textarea id="fnotes" placeholder="What worked? What would you change next time?"></textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveFinish('${did}')">Finish & save history</button>`;modal.showModal()}
function saveFinish(did){const d=db.days.find(x=>x.id===did);d.jobs=fjobs.value.split('\n').map(x=>x.trim()).filter(Boolean);d.endNotes=fnotes.value.trim();d.finished=true;d.finishedAt=new Date().toISOString();modal.close();save();nav('days');toast('Track day saved')}
function openDayDetail(did){const d=db.days.find(x=>x.id===did);const all=[...(d.prep||[]),...(d.pack||[])];modalTitle.textContent=d.track;modalBody.innerHTML=`<div class="muted">${fmtDate(d.date)} · ${esc(carName(d.carId))}${d.organiser?` · ${esc(d.organiser)}`:''}</div><div class="grid" style="margin-top:12px"><div class="card"><div class="stat">${d.sessions.length}</div><div class="muted small">sessions</div></div><div class="card"><div class="stat">${esc(bestLap(d)||'—')}</div><div class="muted small">latest best lap</div></div></div>${sessionCards(d)}${d.jobs?.length?`<h3>Jobs</h3>${d.jobs.map(x=>`<div class="check"><span>🔧</span><span>${esc(x)}</span></div>`).join('')}`:''}${d.endNotes?`<h3>End-of-day notes</h3><p>${esc(d.endNotes)}</p>`:''}<div class="small muted">Preparation: ${all.filter(x=>x.done).length}/${all.length} completed</div>${!d.finished?`<button class="btn secondary" style="width:100%;margin-top:14px" onclick="modal.close();nav('home')">Continue day</button>`:''}`;modal.showModal()}
function deleteDay(did){if(!confirm('Delete this track day and its sessions?'))return;db.days=db.days.filter(x=>x.id!==did);save()}
function addCustom(type){const t=prompt(type==='prep'?'New preparation item':'New packing item');if(!t)return;(type==='prep'?db.customPrep:db.customPack).push(t.trim());save()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`track-day-log-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.cars||!x.days)throw 0;if(confirm('Replace current Track Day Log data with this backup?')){db=Object.assign({},defaults,x);save();toast('Backup restored')}}catch{alert('That does not look like a Track Day Log backup.')}};r.readAsText(file)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
