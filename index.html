<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15181d;--card2:#1c2026;--line:#2b3038;--text:#f4f6f8;--muted:#9aa3ad;--accent:#f0b429;--good:#48c78e;--bad:#ff6b6b;--r:18px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding-bottom:96px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:20;background:rgba(11,13,16,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 12px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.brand img{width:34px;height:34px}.sub,.small{font-size:12px;color:var(--muted)}main{max-width:760px;margin:auto;padding:16px}.view{display:none}.view.active{display:block}.hero,.card{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px}.hero{padding:20px;background:linear-gradient(145deg,#1d2229,#12151a);border-radius:22px}.hero h1{font-size:27px;margin:4px 0}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{flex-wrap:wrap}.stat{font-size:26px;font-weight:800}.muted{color:var(--muted)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}.sectiontitle h2,.card h3{margin:0}.btn{border:0;border-radius:13px;padding:12px 14px;background:var(--accent);color:#111;font-weight:800}.btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3b1d20;color:#ffb9bd;border:1px solid #5f2b31}.btn.smallbtn{padding:8px 10px;font-size:13px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select,textarea{width:100%;background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:84px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.check{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}.check input{width:22px;height:22px;accent-color:var(--accent);margin:0}.check.done .ctxt{text-decoration:line-through;color:var(--muted)}.progress{height:8px;background:#292e35;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.pill{display:inline-block;border:1px solid var(--line);background:var(--card2);color:var(--muted);padding:5px 8px;border-radius:999px;font-size:12px}.pill.good{color:#baf3d9;border-color:#285d46}.session{border-left:3px solid var(--accent)}.metric{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.metric div{background:#0f1216;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}.metric b{display:block}.empty{text-align:center;color:var(--muted);padding:30px 14px}.code{font:700 18px ui-monospace,SFMono-Regular,monospace;letter-spacing:1px;background:#0f1216;border:1px dashed #4a515b;border-radius:12px;padding:12px;text-align:center;margin:10px 0}.axle{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tyrebox{background:#0f1216;border:1px solid var(--line);border-radius:14px;padding:10px}.tyrebox strong{display:block;margin-bottom:4px}.fuelbuttons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.choice{background:#0f1216;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 6px;font-weight:700}.choice.active{background:var(--accent);color:#111;border-color:var(--accent)}.note{margin-top:8px;padding:10px;background:#101318;border:1px solid var(--line);border-radius:12px}nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(15,17,21,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line)}nav button{background:none;border:0;color:var(--muted);padding:6px 3px;font-size:11px}nav button span{display:block;font-size:21px}nav button.active{color:var(--accent)}dialog{width:min(94vw,680px);max-height:88vh;overflow:auto;border:1px solid var(--line);border-radius:20px;background:#15181d;color:var(--text);padding:18px}dialog::backdrop{background:#0009}.dialogtop{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;color:var(--muted);font-size:28px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:10px 14px;border-radius:12px;z-index:100;display:none;white-space:nowrap}@media(max-width:520px){.grid,.formgrid{grid-template-columns:1fr}.metric{grid-template-columns:1fr 1fr}.hero h1{font-size:24px}.fuelbuttons{grid-template-columns:repeat(3,1fr)}}
</style>

<body>
<header><div class="brand"><img src="icon.svg" alt=""><div>Track Day Log<div class="sub">Prepare · Drive · Learn</div></div></div></header>
<main><section id="home" class="view active"></section><section id="garage" class="view"></section><section id="days" class="view"></section><section id="settings" class="view"></section></main>
<nav><button data-view="home" class="active"><span>🏁</span>Today</button><button data-view="garage"><span>🚗</span>Garage</button><button data-view="days"><span>🗓️</span>Track Days</button><button data-view="settings"><span>⚙️</span>Settings</button></nav>
<div id="toast" class="toast"></div><dialog id="modal"><div class="dialogtop"><h2 id="modalTitle"></h2><button class="close" onclick="modal.close()">×</button></div><div id="modalBody"></div></dialog>
<script>
const KEY='trackDayLogV1',SYNC_KEY_NAME='trackDayLogSyncKeyV1';
const SUPABASE_URL='https://uehmbzwnbariqebbxcst.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlaG1ienduYmFyaXFlYmJ4Y3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNjcyODIsImV4cCI6MjEwNDY0MzI4Mn0.zA_oLHdFNGi9nu5Z4zRT9dAMGGRjkXg5jyNwgf_n1Ok';
const defaults={version:5,cars:[],days:[],customPrep:[],customTrack:[],customPack:[],updatedAt:null};
const prepDefault=['Engine oil level','Coolant level','Brake fluid level','Steering / power steering check','Check for fluid leaks','Brake pad material','Brake discs visual check','Tyre condition and damage','Wheel bearings / play','Suspension and steering visual check','Battery secure','Seats and mounts secure','Harnesses / seat belts secure','Fire extinguisher secure (if fitted)'];
const trackDefault=['Quick fluid / leak check','Wheel nuts / bolts torqued','Cold tyre pressures set','Fuel level','Cabin and boot clear of loose items','Towing eye fitted if required','Helmet and clothing ready','Doors, bonnet and boot secure'];
const packDefault=['Helmet','Driving licence / ID','Booking confirmation','Tyre pressure gauge','Torque wrench','Air compressor / pump','Basic tools','Spare fluids','Towing eye','Phone charger / power bank','Water / food'];
let db=load(),syncCode=localStorage.getItem(SYNC_KEY_NAME)||makeSyncCode(),syncTimer,codeVisible=false;localStorage.setItem(SYNC_KEY_NAME,syncCode);
function normaliseTyreSize(v){v=String(v||'').trim().toUpperCase().replace(/\s+/g,' ');const m=v.match(/^(\d{3})\s*[\/ -]\s*(\d{2})\s*(?:R|\/|-)?\s*(\d{2})$/);return m?`${m[1]}/${m[2]} R${m[3]}`:v}
function parseLap(v){let t=String(v||'').trim().toLowerCase().replace(/\s+/g,'').replace('m',':').replace('s','');if(!t)return null;if(/^\d+\.\d+\.\d+$/.test(t)){const a=t.split('.');t=a[0]+':'+a[1]+'.'+a[2]}if(/^\d+:\d+(?:\.\d+)?$/.test(t)){const [m,sec]=t.split(':');const n=Number(m)*60+Number(sec);return Number.isFinite(n)?{seconds:n,text:`${Number(m)}:${Number(sec).toFixed(sec.includes('.')?sec.split('.')[1].length:0).padStart(2,'0')}`}:null}if(/^\d+(?:\.\d+)?$/.test(t)){const n=Number(t);if(!Number.isFinite(n))return null;const m=Math.floor(n/60),sec=n-m*60;return{text:m?`${m}:${sec.toFixed(t.includes('.')?t.split('.')[1].length:0).padStart(2,'0')}`:sec.toFixed(t.includes('.')?t.split('.')[1].length:0),seconds:n}}return null}
function migrate(x){x=Object.assign({},defaults,x||{});x.version=5;x.customTrack=x.customTrack||[];x.cars=(x.cars||[]).map(c=>({...c,tyreBrand:c.tyreBrand||'',frontTyreSize:normaliseTyreSize(c.frontTyreSize||c.tyres||''),rearTyreSize:normaliseTyreSize(c.rearTyreSize||c.tyres||''),coldF:c.coldF||'',coldR:c.coldR||''}));x.days=(x.days||[]).map(d=>{const car=x.cars.find(c=>c.id===d.carId)||{};let home=[...(d.prep||[])],track=[...(d.preTrack||[])];if(!d.preTrack){const trackNames=new Set(['Wheel nuts / bolts torqued','Cold tyre pressures set','Cabin and boot clear of loose items','Fuel level']);track=home.filter(i=>trackNames.has(i.text));home=home.filter(i=>!trackNames.has(i.text))}const ensure=(arr,names)=>{const seen=new Set(arr.map(i=>i.text));for(const t of names)if(!seen.has(t))arr.push({id:id(),text:t,done:false});return arr};home=ensure(home,prepDefault);track=ensure(track,trackDefault);return {...d,prep:home,preTrack:track,layout:d.layout||'',eventType:d.eventType||'',startColdF:d.startColdF||car.coldF||'',startColdR:d.startColdR||car.coldR||'',startFuel:d.startFuel||'',conditions:d.conditions||'',weather:d.weather||'',sessions:(d.sessions||[]).map(ss=>{const lp=parseLap(ss.lap);const recognised=['¼ tank','½ tank','¾ tank','Full','Reserve'];return {...ss,lap:lp?lp.text:(ss.lap||''),lapSeconds:lp?lp.seconds:null,fuel:recognised.includes(ss.fuel)?ss.fuel:'',fuelNote:ss.fuel&&!recognised.includes(ss.fuel)?ss.fuel:(ss.fuelNote||''),carNotes:ss.carNotes||ss.notes||'',driverNotes:ss.driverNotes||'',adjustmentType:ss.adjustmentType||'',adjustment:ss.adjustment||''}})}});return x}
function load(){try{return migrate(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(defaults)}}
function makeSyncCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',a=new Uint32Array(8);crypto.getRandomValues(a);return'TDL-'+[...a].slice(0,4).map(x=>chars[x%chars.length]).join('')+'-'+[...a].slice(4).map(x=>chars[x%chars.length]).join('')}
function headers(){return{'apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON,'Content-Type':'application/json'}}
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:headers(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function cloudPush(){try{await rpc('track_day_log_push',{p_sync_key:syncCode,p_data:db});setCloud('Synced')}catch(e){console.warn(e);setCloud('Offline — saved on device')}}
async function cloudPull(code=syncCode){const rows=await rpc('track_day_log_pull',{p_sync_key:code});return rows&&rows.length?rows[0]:null}
function save(skipCloud=false){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));render();if(!skipCloud){clearTimeout(syncTimer);syncTimer=setTimeout(cloudPush,450)}}
async function bootSync(){try{const remote=await cloudPull();if(remote&&remote.data){const localEmpty=!db.cars.length&&!db.days.length;const remoteNewer=(remote.data.updatedAt||'')>(db.updatedAt||'');if(localEmpty||remoteNewer){db=migrate(remote.data);localStorage.setItem(KEY,JSON.stringify(db));render()}}else await cloudPush();setCloud('Synced')}catch(e){console.warn(e);setCloud('Offline — saved on device')}}
function setCloud(t){const e=document.getElementById('cloudState');if(e)e.textContent=t}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(v){if(!v)return'';return new Date(v+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function carName(cid){const c=db.cars.find(x=>x.id===cid);return c?c.name:'No car'}function carById(cid){return db.cars.find(x=>x.id===cid)||{}}function trackLabel(d){return[d.track,d.layout].filter(Boolean).join(' · ')}function currentDay(){return db.days.filter(d=>!d.finished).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function render(){renderHome();renderGarage();renderDays();renderSettings()}
function renderHome(){const el=home,d=currentDay();if(!db.cars.length){el.innerHTML=`<div class="hero"><span class="pill">WELCOME</span><h1>Ready for your first track day?</h1><p>Add your car once. Then prepare, log sessions and build a useful history every time you go out.</p></div><button class="btn" onclick="openCar()">Add your first car</button>`;return}if(!d){el.innerHTML=`<div class="hero"><h1>Your next track day starts here.</h1><p>Create an event and the app will carry your car setup into the day while keeping the event itself separate.</p></div><div class="grid"><div class="card"><div class="stat">${db.cars.length}</div><div class="muted">car${db.cars.length===1?'':'s'} in garage</div></div><div class="card"><div class="stat">${db.days.filter(x=>x.finished).length}</div><div class="muted">completed days</div></div></div><button class="btn" onclick="openDay()">Create track day</button>`;return}
const homeChecks=d.prep||[],trackChecks=d.preTrack||[],packChecks=d.pack||[],checks=[...homeChecks,...trackChecks,...packChecks],done=checks.filter(x=>x.done).length,pct=checks.length?Math.round(done/checks.length*100):0;const hp=homeChecks.length?Math.round(homeChecks.filter(x=>x.done).length/homeChecks.length*100):0,tp=trackChecks.length?Math.round(trackChecks.filter(x=>x.done).length/trackChecks.length*100):0,pp=packChecks.length?Math.round(packChecks.filter(x=>x.done).length/packChecks.length*100):0;
el.innerHTML=`<div class="hero"><span class="pill">NEXT TRACK DAY</span><h1>${esc(trackLabel(d))}</h1><p>${fmtDate(d.date)} · ${esc(carName(d.carId))}${d.conditions?` · ${esc(d.conditions)}`:''}</p></div>
<div class="card"><div class="row"><b>Starting setup</b><span class="pill">${esc(d.eventType||'Track day')}</span></div><div class="small muted" style="margin-top:8px">Cold ${esc(d.startColdF||'—')}F / ${esc(d.startColdR||'—')}R psi${d.startFuel?` · Fuel ${esc(d.startFuel)}`:''}${d.weather?` · ${esc(d.weather)}`:''}</div></div>
<div class="card"><div class="row"><b>Preparation</b><span>${done}/${checks.length}</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="small muted" style="margin-top:8px">Home ${hp}% · Before track ${tp}% · Packing ${pp}%</div></div>
<div class="grid"><button class="btn secondary" onclick="openChecklist('${d.id}')">Preparation</button><button class="btn secondary" onclick="openSession('${d.id}')">+ Log session</button></div>
<div class="sectiontitle"><h2>Sessions</h2><span class="pill">${(d.sessions||[]).length}</span></div>${sessionCards(d)}
<button class="btn" style="width:100%;margin-top:8px" onclick="finishDay('${d.id}')">Finish track day</button>`}
function renderGarage(){garage.innerHTML=`<div class="sectiontitle"><h2>Garage</h2><button class="btn smallbtn" onclick="openCar()">+ Add car</button></div>${db.cars.length?db.cars.map(c=>`<div class="card"><div class="row"><div><h3>${esc(c.name)}</h3><div class="muted small">${esc([c.year,c.make,c.model].filter(Boolean).join(' · '))}</div></div><button class="btn secondary smallbtn" onclick="openCar('${c.id}')">Edit</button></div>${c.tyreBrand?`<div class="small" style="margin-top:10px">${esc(c.tyreBrand)}</div>`:''}<div class="small muted" style="margin-top:4px">Front ${esc(c.frontTyreSize||'—')} · Rear ${esc(c.rearTyreSize||'—')}</div>${(c.coldF||c.coldR)?`<div class="small" style="margin-top:5px">Baseline cold: ${esc(c.coldF||'—')}F / ${esc(c.coldR||'—')}R psi</div>`:''}${c.notes?`<p class="small">${esc(c.notes)}</p>`:''}</div>`).join(''):`<div class="empty">No cars added yet.</div>`}`}
function renderDays(){const xs=[...db.days].sort((a,b)=>b.date.localeCompare(a.date));days.innerHTML=`<div class="sectiontitle"><h2>Track Days</h2><button class="btn smallbtn" onclick="openDay()">+ New</button></div>${xs.length?xs.map(d=>`<div class="card"><div class="row"><div><h3>${esc(trackLabel(d))}</h3><div class="muted small">${fmtDate(d.date)} · ${esc(carName(d.carId))}</div></div><span class="pill ${d.finished?'good':''}">${d.finished?'Finished':'Active'}</span></div><div class="row wrap" style="margin-top:12px"><span class="small muted">${(d.sessions||[]).length} sessions${bestLap(d)?` · PB ${esc(bestLap(d))}`:''}</span><div><button class="btn secondary smallbtn" onclick="openDayDetail('${d.id}')">Open</button> <button class="btn danger smallbtn" onclick="deleteDay('${d.id}')">Delete</button></div></div></div>`).join(''):`<div class="empty">Your track-day history will appear here.</div>`}`}
function renderSettings(){settings.innerHTML=`<div class="sectiontitle"><h2>Settings & backup</h2></div>
<div class="card"><div class="row"><h3>Cloud recovery</h3><span id="cloudState" class="pill">Syncing…</span></div><p class="small muted">Your private recovery code lets you restore this garage and track-day history after reinstalling or on another device.</p><div class="code">${codeVisible?esc(syncCode):'TDL-••••-••••'}</div><div class="grid"><button class="btn secondary" onclick="toggleCode()">${codeVisible?'Hide':'Reveal'} code</button><button class="btn secondary" onclick="copyCode()">Copy code</button></div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="useExistingCode()">Use existing code</button><button class="btn danger" style="width:100%;margin-top:10px" onclick="rotateCode()">Rotate recovery code</button><p class="small muted">Anyone with the code can access this app data. Keep it private.</p></div>
<div class="card"><h3>Manual backup</h3><div class="grid" style="margin-top:10px"><button class="btn secondary" onclick="exportData()">Export backup</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Restore backup</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></div>
<div class="card"><h3>Custom checklist items</h3><p class="small muted">Choose when each recurring item belongs.</p><div class="grid"><button class="btn secondary" onclick="addCustom('prep')">+ At home</button><button class="btn secondary" onclick="addCustom('track')">+ Before track</button></div><button class="btn secondary" style="width:100%;margin-top:8px" onclick="addCustom('pack')">+ Packing</button>${[...db.customPrep.map(x=>'Home: '+x),...db.customTrack.map(x=>'Track: '+x),...db.customPack.map(x=>'Pack: '+x)].map(x=>`<div class="small" style="margin-top:8px">• ${esc(x)}</div>`).join('')}</div>`}
function openCar(cid){const c=db.cars.find(x=>x.id===cid)||{};modalTitle.textContent=cid?'Edit car':'Add car';modalBody.innerHTML=`<label>Car name</label><input id="cname" value="${esc(c.name||'')}" placeholder="e.g. Civic Type R">
<div class="formgrid"><div><label>Year</label><input id="cyear" inputmode="numeric" value="${esc(c.year||'')}"></div><div><label>Make</label><input id="cmake" value="${esc(c.make||'')}"></div></div>
<label>Model</label><input id="cmodel" value="${esc(c.model||'')}">
<label>Tyre make / model</label><input id="ctyrebrand" value="${esc(c.tyreBrand||'')}" placeholder="e.g. Nankang NS-2R">
<div class="formgrid"><div><label>Front tyre size</label><input id="cfrontsize" value="${esc(c.frontTyreSize||c.tyres||'')}" placeholder="205/45 R16"></div><div><label>Rear tyre size</label><input id="crearsize" value="${esc(c.rearTyreSize||c.tyres||'')}" placeholder="205/45 R16"></div></div>
<div class="formgrid"><div><label>Baseline cold front psi</label><input id="ccoldf" type="number" step="0.5" value="${esc(c.coldF||'')}"></div><div><label>Baseline cold rear psi</label><input id="ccoldr" type="number" step="0.5" value="${esc(c.coldR||'')}"></div></div>
<label>Track notes</label><textarea id="cnotes">${esc(c.notes||'')}</textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveCar('${cid||''}')">Save car</button>`;modal.showModal()}
function saveCar(cid){const x={id:cid||id(),name:cname.value.trim(),year:cyear.value.trim(),make:cmake.value.trim(),model:cmodel.value.trim(),tyreBrand:ctyrebrand.value.trim(),frontTyreSize:normaliseTyreSize(cfrontsize.value),rearTyreSize:normaliseTyreSize(crearsize.value),coldF:ccoldf.value,coldR:ccoldr.value,notes:cnotes.value.trim()};if(!x.name)return toast('Give the car a name');const i=db.cars.findIndex(c=>c.id===cid);i>=0?db.cars[i]=x:db.cars.push(x);modal.close();save();toast('Car saved')}
function openDay(){if(!db.cars.length)return openCar();const c=db.cars[0];modalTitle.textContent='New track day';modalBody.innerHTML=`<div class="formgrid"><div><label>Circuit</label><input id="dtrack" placeholder="e.g. Castle Combe"></div><div><label>Layout</label><input id="dlayout" placeholder="e.g. Grand Prix / Full"></div></div><div class="formgrid"><div><label>Date</label><input id="ddate" type="date"></div><div><label>Car</label><select id="dcar" onchange="dayCarChanged()">${db.cars.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div><div class="formgrid"><div><label>Organiser</label><input id="dorg" placeholder="Optional"></div><div><label>Event type</label><select id="dtype"><option>Open pit lane</option><option>Sessions</option><option>Evening</option><option>Test day</option><option>Other</option></select></div></div><h3 style="margin-top:18px">Starting setup</h3><div class="formgrid"><div><label>Cold front psi</label><input id="dstartf" type="number" step="0.5" value="${esc(c.coldF||'')}"></div><div><label>Cold rear psi</label><input id="dstartr" type="number" step="0.5" value="${esc(c.coldR||'')}"></div></div><div class="formgrid"><div><label>Starting fuel</label><select id="dfuel"><option value="">Not set</option><option>¼ tank</option><option>½ tank</option><option>¾ tank</option><option>Full</option></select></div><div><label>Track conditions</label><select id="dconditions"><option>Dry</option><option>Damp</option><option>Wet</option><option>Mixed</option><option>Unknown</option></select></div></div><label>Weather / temperature note</label><input id="dweather" placeholder="e.g. 18°C, dry, light wind"><button class="btn" style="width:100%;margin-top:14px" onclick="saveDay()">Create track day</button>`;modal.showModal()}
function dayCarChanged(){const c=carById(dcar.value);dstartf.value=c.coldF||'';dstartr.value=c.coldR||''}
function saveDay(){if(!dtrack.value.trim()||!ddate.value)return toast('Add circuit and date');const prep=[...prepDefault,...db.customPrep].map(t=>({id:id(),text:t,done:false})),preTrack=[...trackDefault,...db.customTrack].map(t=>({id:id(),text:t,done:false})),pack=[...packDefault,...db.customPack].map(t=>({id:id(),text:t,done:false}));db.days.push({id:id(),track:dtrack.value.trim(),layout:dlayout.value.trim(),date:ddate.value,carId:dcar.value,organiser:dorg.value.trim(),eventType:dtype.value,startColdF:dstartf.value,startColdR:dstartr.value,startFuel:dfuel.value,conditions:dconditions.value,weather:dweather.value.trim(),prep,preTrack,pack,sessions:[],jobs:[],finished:false});modal.close();save();nav('home');toast('Track day created')}
function sectionProgress(items){const n=(items||[]).length,d=(items||[]).filter(x=>x.done).length;return {n,d,p:n?Math.round(d/n*100):0}}
function openChecklist(did,section='menu'){const d=db.days.find(x=>x.id===did);if(section==='menu'){const a=sectionProgress(d.prep),b=sectionProgress(d.preTrack),c=sectionProgress(d.pack);modalTitle.textContent='Preparation';modalBody.innerHTML=`<p class="small muted">Work through these at the right time instead of one long list.</p><div class="card"><div class="row"><div><h3>At home</h3><div class="small muted">Deeper mechanical and safety checks</div></div><b>${a.d}/${a.n}</b></div><div class="progress" style="margin:10px 0"><span style="width:${a.p}%"></span></div><button class="btn secondary" style="width:100%" onclick="openChecklist('${did}','prep')">Open home prep</button></div><div class="card"><div class="row"><div><h3>Before going on track</h3><div class="small muted">Quick checks at the circuit</div></div><b>${b.d}/${b.n}</b></div><div class="progress" style="margin:10px 0"><span style="width:${b.p}%"></span></div><button class="btn secondary" style="width:100%" onclick="openChecklist('${did}','preTrack')">Open pre-track checks</button></div><div class="card"><div class="row"><div><h3>Packing</h3><div class="small muted">Things to bring with you</div></div><b>${c.d}/${c.n}</b></div><div class="progress" style="margin:10px 0"><span style="width:${c.p}%"></span></div><button class="btn secondary" style="width:100%" onclick="openChecklist('${did}','pack')">Open packing list</button></div>`;modal.showModal();return}const title=section==='prep'?'At home':section==='preTrack'?'Before going on track':'Packing';modalTitle.textContent=title;modalBody.innerHTML=`<button class="btn secondary smallbtn" onclick="openChecklist('${did}')">← All preparation</button><div style="margin-top:12px">${checkHtml(d,section)}</div><button class="btn secondary" style="width:100%;margin-top:14px" onclick="addDayCheck('${did}','${section}')">+ Add item to this section</button>`;modal.showModal()}
function checkHtml(d,type){return (d[type]||[]).map(x=>`<label class="check ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="toggleCheck('${d.id}','${type}','${x.id}',this.checked)"><span class="ctxt">${esc(x.text)}${x.checkedAt?`<span class="small muted" style="display:block">${new Date(x.checkedAt).toLocaleString()}</span>`:''}</span></label>`).join('')}
function toggleCheck(did,type,cid,val){const d=db.days.find(x=>x.id===did),c=d[type].find(x=>x.id===cid);c.done=val;c.checkedAt=val?new Date().toISOString():null;save();openChecklist(did,type)}
function addDayCheck(did,type='prep'){const t=prompt('Checklist item');if(!t)return;const d=db.days.find(x=>x.id===did);d[type].push({id:id(),text:t.trim(),done:false});save();openChecklist(did,type)}
function openSession(did){const d=db.days.find(x=>x.id===did),prev=(d.sessions||[]).at(-1);modalTitle.textContent=`Session ${(d.sessions||[]).length+1}`;modalBody.innerHTML=`<div><label>Best lap</label><input id="slap" inputmode="decimal" placeholder="1:20.04, 1.20.04 or 80.04"><div class="small muted" style="margin-top:4px">We'll normalise common lap-time formats automatically.</div></div><label>Fuel after session</label><div class="fuelbuttons"><button type="button" class="choice" onclick="pickFuel(this,'¼ tank')">¼</button><button type="button" class="choice" onclick="pickFuel(this,'½ tank')">½</button><button type="button" class="choice" onclick="pickFuel(this,'¾ tank')">¾</button><button type="button" class="choice" onclick="pickFuel(this,'Full')">Full</button><button type="button" class="choice" onclick="pickFuel(this,'Reserve')">Reserve</button></div><input id="sfuel" type="hidden"><input id="sfuelnote" style="margin-top:8px" placeholder="Optional fuel note / litres"><h3 style="margin-top:18px">Hot tyre pressures</h3><div class="row wrap" style="margin-bottom:8px"><button type="button" class="btn secondary smallbtn" onclick="samePressures()">Same all round</button><button type="button" class="btn secondary smallbtn" onclick="copyPreviousPressures()">Copy previous</button></div><div class="axle"><div class="tyrebox"><strong>Front left</strong><input id="sfl" type="number" inputmode="decimal" step="0.5" placeholder="psi"></div><div class="tyrebox"><strong>Front right</strong><input id="sfr" type="number" inputmode="decimal" step="0.5" placeholder="psi"></div><div class="tyrebox"><strong>Rear left</strong><input id="srl" type="number" inputmode="decimal" step="0.5" placeholder="psi"></div><div class="tyrebox"><strong>Rear right</strong><input id="srr" type="number" inputmode="decimal" step="0.5" placeholder="psi"></div></div><div class="formgrid"><div><label>Brakes</label><select id="sbr"><option>Good</option><option>Monitor</option><option>Problem</option></select></div><div><label>Temperatures</label><select id="stemp"><option>Good</option><option>Warm</option><option>High</option><option>Unknown</option></select></div></div><label>Car observation</label><textarea id="scarnotes" placeholder="Balance, grip, braking, temperatures, noises..."></textarea><label>Driver observation</label><textarea id="sdrivernotes" placeholder="Braking points, confidence, traffic, corner technique..."></textarea><label>Change before next session</label><select id="sadjtype"><option value="">No change</option><option>Tyre pressure</option><option>Suspension</option><option>Fuel</option><option>Mechanical</option><option>Driving approach</option><option>Other</option></select><textarea id="sadj" placeholder="What are you changing, and why?"></textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveSession('${did}')">Save session</button>`;modal.dataset.prev=prev?JSON.stringify({fl:prev.fl,fr:prev.fr,rl:prev.rl,rr:prev.rr}):'';modal.showModal()}
function pickFuel(btn,v){document.querySelectorAll('.fuelbuttons .choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active');sfuel.value=v}
function samePressures(){if(!sfl.value)return toast('Enter front left first');sfr.value=sfl.value;srl.value=sfl.value;srr.value=sfl.value}
function copyPreviousPressures(){if(!modal.dataset.prev)return toast('No previous session');const p=JSON.parse(modal.dataset.prev);sfl.value=p.fl||'';sfr.value=p.fr||'';srl.value=p.rl||'';srr.value=p.rr||''}
function saveSession(did){const d=db.days.find(x=>x.id===did),lp=parseLap(slap.value);if(slap.value.trim()&&!lp)return toast('Lap time format not recognised');d.sessions.push({id:id(),number:d.sessions.length+1,time:new Date().toISOString(),lap:lp?lp.text:'',lapSeconds:lp?lp.seconds:null,fuel:sfuel.value,fuelNote:sfuelnote.value.trim(),fl:sfl.value,fr:sfr.value,rl:srl.value,rr:srr.value,brakes:sbr.value,temp:stemp.value,carNotes:scarnotes.value.trim(),driverNotes:sdrivernotes.value.trim(),adjustmentType:sadjtype.value,adjustment:sadj.value.trim()});modal.close();save();toast('Session logged')}
function sessionCards(d){if(!(d.sessions||[]).length)return`<div class="empty card">No sessions logged yet.</div>`;return d.sessions.map(s=>`<div class="card session"><div class="row"><h3>Session ${s.number}</h3>${s.lap?`<b>${esc(s.lap)}</b>`:''}</div>${(s.fl||s.fr||s.rl||s.rr)?`<div class="metric"><div><span class="small muted">FL</span><b>${esc(s.fl||'—')}</b></div><div><span class="small muted">FR</span><b>${esc(s.fr||'—')}</b></div><div><span class="small muted">RL</span><b>${esc(s.rl||'—')}</b></div><div><span class="small muted">RR</span><b>${esc(s.rr||'—')}</b></div></div>`:''}<div class="small muted">Brakes: ${esc(s.brakes||'—')} · Temps: ${esc(s.temp||'—')}${s.fuel?` · Fuel: ${esc(s.fuel)}`:''}${s.fuelNote?` · ${esc(s.fuelNote)}`:''}</div>${s.carNotes?`<div class="note"><b>Car</b><div>${esc(s.carNotes)}</div></div>`:''}${s.driverNotes?`<div class="note"><b>Driver</b><div>${esc(s.driverNotes)}</div></div>`:''}${s.adjustment?`<div class="small" style="margin-top:9px"><b>Next${s.adjustmentType?` — ${esc(s.adjustmentType)}`:''}:</b> ${esc(s.adjustment)}</div>`:''}</div>`).join('')}
function bestLap(d){const xs=(d.sessions||[]).map(s=>({text:s.lap,sec:Number.isFinite(s.lapSeconds)?s.lapSeconds:(parseLap(s.lap)?.seconds??Infinity)})).filter(x=>x.text&&Number.isFinite(x.sec));if(!xs.length)return'';xs.sort((a,b)=>a.sec-b.sec);return xs[0].text}
function finishDay(did){modalTitle.textContent='Finish track day';modalBody.innerHTML=`<p class="muted">Capture the useful jobs and lessons before they disappear from memory.</p><label>Jobs / faults found</label><textarea id="fjobs" placeholder="One per line"></textarea><label>End-of-day notes</label><textarea id="fnotes" placeholder="What worked? What would you change next time?"></textarea><button class="btn" style="width:100%;margin-top:14px" onclick="saveFinish('${did}')">Finish & save history</button>`;modal.showModal()}
function saveFinish(did){const d=db.days.find(x=>x.id===did);d.jobs=fjobs.value.split('\n').map(x=>x.trim()).filter(Boolean);d.endNotes=fnotes.value.trim();d.finished=true;d.finishedAt=new Date().toISOString();modal.close();save();nav('days');toast('Track day finished')}
function openDayDetail(did){const d=db.days.find(x=>x.id===did),all=[...(d.prep||[]),...(d.preTrack||[]),...(d.pack||[])];modalTitle.textContent=trackLabel(d);modalBody.innerHTML=`<div class="muted">${fmtDate(d.date)} · ${esc(carName(d.carId))}${d.organiser?` · ${esc(d.organiser)}`:''}</div><div class="card" style="margin-top:12px"><b>Starting setup</b><div class="small muted" style="margin-top:6px">${esc(d.eventType||'Track day')} · ${esc(d.conditions||'Conditions not recorded')}${d.weather?` · ${esc(d.weather)}`:''}<br>Cold ${esc(d.startColdF||'—')}F / ${esc(d.startColdR||'—')}R psi${d.startFuel?` · Fuel ${esc(d.startFuel)}`:''}</div></div><div class="grid"><div class="card"><div class="stat">${d.sessions.length}</div><div class="muted small">sessions</div></div><div class="card"><div class="stat">${esc(bestLap(d)||'—')}</div><div class="muted small">best lap</div></div></div>${sessionCards(d)}${d.jobs?.length?`<h3>Jobs</h3>${d.jobs.map(x=>`<div class="check"><span>🔧</span><span>${esc(x)}</span></div>`).join('')}`:''}${d.endNotes?`<h3>End-of-day notes</h3><p>${esc(d.endNotes)}</p>`:''}<div class="small muted">Preparation: ${all.filter(x=>x.done).length}/${all.length} completed</div>${!d.finished?`<button class="btn secondary" style="width:100%;margin-top:14px" onclick="modal.close();nav('home')">Continue day</button>`:''}`;modal.showModal()}
function deleteDay(did){if(!confirm('Delete this track day and its sessions?'))return;db.days=db.days.filter(x=>x.id!==did);save()}
function addCustom(type){const label=type==='prep'?'New at-home preparation item':type==='track'?'New pre-track item':'New packing item';const t=prompt(label);if(!t)return;if(type==='prep')db.customPrep.push(t.trim());else if(type==='track')db.customTrack.push(t.trim());else db.customPack.push(t.trim());save()}
function toggleCode(){codeVisible=!codeVisible;renderSettings()}
async function copyCode(){try{await navigator.clipboard.writeText(syncCode);toast('Recovery code copied')}catch{prompt('Copy this recovery code:',syncCode)}}
async function useExistingCode(){const code=prompt('Enter your Track Day Log recovery code:','TDL-');if(!code)return;try{const row=await cloudPull(code.trim().toUpperCase());if(!row||!row.data)return alert('No cloud data was found for that code.');if(!confirm('Replace the data on this device with the cloud data for that code?'))return;syncCode=code.trim().toUpperCase();localStorage.setItem(SYNC_KEY_NAME,syncCode);db=migrate(row.data);localStorage.setItem(KEY,JSON.stringify(db));render();toast('Cloud data restored')}catch(e){alert('Could not restore that code right now.')}}
async function rotateCode(){if(!confirm('Create a new recovery code for this device? Save the new code somewhere safe. The old code will no longer receive future updates.'))return;syncCode=makeSyncCode();localStorage.setItem(SYNC_KEY_NAME,syncCode);codeVisible=true;await cloudPush();renderSettings();toast('New recovery code created')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`track-day-log-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.cars||!x.days)throw 0;if(confirm('Replace current Track Day Log data with this backup?')){db=migrate(x);save();toast('Backup restored')}}catch{alert('That does not look like a Track Day Log backup.')}};r.readAsText(file)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();bootSync();
</script></body></html>
